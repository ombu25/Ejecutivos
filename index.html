<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club Actinver · Dashboard Ejecutivo</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Open+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --azul:#314566;--azul-mid:#3D567E;--azul-bright:#4A6A9C;
  --gold:#C9A867;--gold-light:#D4B87A;--gold-xlight:#E2CE9E;
  --bg-0:#03060D;--bg-1:#060C18;--bg-2:#0A1222;--bg-3:#0F1A30;
  --g-card:rgba(255,255,255,0.058);--g-raised:rgba(255,255,255,0.078);--g-hover:rgba(255,255,255,0.095);
  --g-gold:rgba(201,168,103,0.065);
  --b-subtle:rgba(255,255,255,0.055);--b-card:rgba(255,255,255,0.078);--b-hover:rgba(255,255,255,0.14);
  --b-gold:rgba(201,168,103,0.16);--b-gold-s:rgba(201,168,103,0.28);
  --green:#3DD68C;--red:#FF6B6B;--amber:#F5A623;
  --t1:#F2EEE8;--t2:rgba(242,238,232,0.72);--t3:rgba(242,238,232,0.5);--t4:rgba(242,238,232,0.28);
  --r1:6px;--r2:10px;--r3:16px;
  --sp1:8px;--sp2:16px;--sp3:24px;--sp4:32px;
  --shadow-card:0 1px 3px rgba(0,0,0,0.4),0 8px 24px rgba(0,0,0,0.25);
}
body.day{
  --bg-0:#EFF1F5;--bg-1:#E6E9EF;--bg-2:#FFFFFF;--bg-3:#F5F2EB;
  --g-card:rgba(49,69,102,0.05);--g-raised:rgba(49,69,102,0.09);--g-hover:rgba(49,69,102,0.13);
  --g-gold:rgba(168,131,42,0.08);
  --b-subtle:rgba(49,69,102,0.12);--b-card:rgba(49,69,102,0.16);--b-hover:rgba(49,69,102,0.28);
  --b-gold:rgba(168,131,42,0.22);--b-gold-s:rgba(168,131,42,0.38);
  --t1:#1B2A48;--t2:rgba(27,42,72,0.72);--t3:rgba(27,42,72,0.55);--t4:rgba(27,42,72,0.3);
  --gold:#8A6B1E;--gold-light:#7A5E18;--gold-xlight:#5C4612;
  --green:#1DB863;--red:#D94040;--amber:#C07C00;
  --shadow-card:0 1px 4px rgba(49,69,102,0.1),0 4px 16px rgba(49,69,102,0.07);
}
html,body{background:var(--bg-0);color:var(--t1);font-family:"Open Sans",sans-serif;font-size:13px;line-height:1.5;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 90% 60% at 8% -8%,rgba(49,69,102,0.32) 0%,transparent 50%),radial-gradient(ellipse 60% 50% at 92% 4%,rgba(201,168,103,0.08) 0%,transparent 48%)}
body.day::before{background:radial-gradient(ellipse 90% 60% at 8% -8%,rgba(49,69,102,0.06) 0%,transparent 50%)}
.shell{position:relative;z-index:1;min-height:100vh}
/* TOPBAR */
.topbar{display:flex;align-items:center;gap:var(--sp2);padding:0 var(--sp3);height:56px;background:rgba(3,6,13,0.82);backdrop-filter:blur(24px) saturate(140%);border-bottom:0.5px solid var(--b-subtle);position:sticky;top:0;z-index:200}
body.day .topbar{background:rgba(255,255,255,0.9)}
.topbar::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold) 30%,rgba(201,168,103,0.3) 70%,transparent);opacity:.35}
.brand{display:flex;align-items:center;gap:12px;padding-right:var(--sp3);border-right:0.5px solid var(--b-subtle)}
.brand img{height:22px;width:auto;opacity:.9;mix-blend-mode:screen;filter:brightness(1.1)}
body.day .brand img{mix-blend-mode:normal;filter:none}
.brand-txt{font-family:"Poppins",sans-serif;font-size:12px;font-weight:600;letter-spacing:.5px;color:var(--t2);text-transform:uppercase;display:flex;align-items:center;gap:6px}
.brand-dot{width:6px;height:6px;border-radius:50%;background:#E6C78A}
.topbar-title{font-family:"Poppins",sans-serif;font-size:14px;font-weight:600;color:var(--t1)}
.topbar-title em{color:var(--gold);font-style:normal;font-weight:300}
.topbar-r{display:flex;align-items:center;gap:var(--sp1);margin-left:auto}
select{background:var(--bg-3);color:var(--gold-light);border:0.5px solid var(--b-gold-s);border-radius:var(--r1);padding:7px 12px;font-family:"Poppins",sans-serif;font-size:12px;font-weight:600;cursor:pointer;outline:none}
body.day select{background:#fff;color:var(--gold-light)}
.badge{background:rgba(245,166,35,0.1);border:0.5px solid rgba(245,166,35,0.3);border-radius:20px;padding:3px 10px;font-family:"Poppins",sans-serif;font-size:10px;font-weight:700;color:var(--amber);letter-spacing:.5px}
.theme-toggle{display:flex;align-items:center;gap:6px;background:var(--g-card);border:0.5px solid var(--b-card);border-radius:var(--r1);padding:6px 10px;cursor:pointer;user-select:none}
.tt-track{width:30px;height:17px;border-radius:9px;background:var(--azul-mid);position:relative;transition:background .25s}
body.day .tt-track{background:var(--gold)}
.tt-thumb{position:absolute;top:2.5px;left:2.5px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .22s}
body.day .tt-thumb{transform:translateX(13px)}
.tt-icon{font-size:12px}.tt-moon{opacity:.9}.tt-sun{opacity:.35}
body.day .tt-moon{opacity:.35}body.day .tt-sun{opacity:.9}
/* MAIN */
.main{padding:var(--sp3) var(--sp4);max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:var(--sp3)}
.ph{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:var(--sp2)}
.ph-eyebrow{font-size:10px;font-weight:700;font-family:"Poppins",sans-serif;color:var(--t3);text-transform:uppercase;letter-spacing:2.5px;margin-bottom:6px}
.ph-title-wrap{display:flex;align-items:center;gap:12px}
.ph-gold-bar{width:3px;height:34px;background:linear-gradient(180deg,var(--gold),transparent);border-radius:2px}
.ph-title{font-family:"Poppins",sans-serif;font-size:22px;font-weight:600;color:var(--t1);letter-spacing:-.3px}
.ph-title em{color:var(--gold);font-style:normal;font-weight:300}
.ph-meta{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--t3)}
/* SUMMARY STRIP */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp1)}
.strip-card{background:var(--g-card);border:0.5px solid var(--b-card);border-radius:var(--r2);padding:var(--sp2) var(--sp2);box-shadow:var(--shadow-card)}
.strip-lbl{font-size:10px;font-weight:700;font-family:"Poppins",sans-serif;color:var(--t3);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.strip-val{font-family:"Poppins",sans-serif;font-size:30px;font-weight:300;color:var(--t1);line-height:1}
.strip-val em{font-size:14px;color:var(--gold);font-style:normal}
.strip-sub{font-size:11px;color:var(--t3);font-family:"JetBrains Mono",monospace;margin-top:6px}
/* SECTION */
.sec-title{display:flex;align-items:center;gap:10px;font-family:"Poppins",sans-serif;font-size:13px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:var(--sp1)}
.sec-title::before{content:"";width:3px;height:16px;background:var(--gold);border-radius:2px}
/* ADVISOR CARDS */
.ase-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--sp2)}
.ase-card{background:var(--g-card);border:0.5px solid var(--b-card);border-radius:var(--r3);padding:var(--sp2);box-shadow:var(--shadow-card);position:relative;overflow:hidden}
.ase-card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),transparent)}
.ase-rank{position:absolute;top:12px;right:14px;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--t4);font-weight:600}
.ase-name{font-family:"Poppins",sans-serif;font-size:12px;font-weight:700;color:var(--t1);letter-spacing:.3px;margin-bottom:2px;padding-right:24px}
.ase-role{font-size:10px;color:var(--t3);font-family:"JetBrains Mono",monospace;margin-bottom:var(--sp2)}
.ase-big{font-family:"Poppins",sans-serif;font-size:42px;font-weight:300;color:var(--gold);line-height:1}
.ase-big-lbl{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;font-family:"Poppins",sans-serif;font-weight:600;margin-top:2px}
.pp-bar{height:6px;border-radius:3px;overflow:hidden;display:flex;margin:var(--sp2) 0 6px}
.pp-plus{background:var(--azul-bright)}.pp-prime{background:var(--gold)}
.pp-legend{display:flex;justify-content:space-between;font-size:10px;font-family:"JetBrains Mono",monospace;color:var(--t3)}
.pp-legend b{color:var(--t2);font-weight:600}
.ase-mini{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:var(--sp2);padding-top:var(--sp2);border-top:0.5px solid var(--b-subtle)}
.mini{text-align:center}
.mini-v{font-family:"Poppins",sans-serif;font-size:16px;font-weight:600;color:var(--t1);line-height:1}
.mini-l{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
/* TABLES */
.tbl-wrap{background:var(--g-card);border:0.5px solid var(--b-card);border-radius:var(--r2);overflow-x:auto;box-shadow:var(--shadow-card)}
table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
th,td{padding:11px 14px;text-align:right}
th:first-child,td:first-child{text-align:left}
thead th{font-family:"Poppins",sans-serif;font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.6px;border-bottom:0.5px solid var(--b-card);position:sticky;top:0;background:var(--bg-2)}
tbody td{border-bottom:0.5px solid var(--b-subtle);font-family:"JetBrains Mono",monospace;color:var(--t2)}
tbody td:first-child{font-family:"Poppins",sans-serif;font-weight:600;color:var(--t1)}
tbody tr:hover{background:var(--g-raised)}
tbody tr.total-row{background:var(--g-gold)}
tbody tr.total-row td{border-top:1px solid var(--b-gold-s);color:var(--gold-light);font-weight:700}
tbody tr.total-row td:first-child{color:var(--gold-light)}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:600}
.pill-hi{background:rgba(61,214,140,0.12);color:var(--green)}
.pill-mid{background:rgba(245,166,35,0.12);color:var(--amber)}
.pill-lo{background:rgba(255,107,107,0.12);color:var(--red)}
.empty{padding:60px 20px;text-align:center;color:var(--t3);font-family:"Poppins",sans-serif}
.empty-big{font-size:40px;opacity:.3;margin-bottom:12px}
.foot{text-align:center;font-size:10px;color:var(--t4);font-family:"JetBrains Mono",monospace;padding:var(--sp3) 0}
@media(max-width:900px){.strip{grid-template-columns:repeat(2,1fr)}.main{padding:var(--sp2)}.topbar{flex-wrap:wrap;height:auto;padding:var(--sp1) var(--sp2);gap:8px}.brand{border:0;padding-right:0}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <img id="brandLogo" alt="Actinver">
      <span class="brand-txt"><span class="brand-dot"></span>Club Actinver</span>
    </div>
    <span class="topbar-title">Dashboard <em>Ejecutivo</em></span>
    <div class="topbar-r">
      <select id="cfSelect" onchange="onCF()"></select>
      <select id="mesSelect" onchange="render()"></select>
      <span class="badge" id="badgeParcial" style="display:none">EN CURSO</span>
      <div class="theme-toggle" onclick="toggleTheme()" title="Modo día/noche">
        <span class="tt-icon tt-moon">🌙</span>
        <div class="tt-track"><div class="tt-thumb"></div></div>
        <span class="tt-icon tt-sun">☀️</span>
      </div>
    </div>
  </header>
  <main class="main" id="main"></main>
  <div class="foot" id="foot"></div>
</div>

<script>
const EXEC = {};
const LOGO = "";
document.getElementById("brandLogo").src = LOGO;
const $=id=>document.getElementById(id);

function toggleTheme(){document.body.classList.toggle("day");try{localStorage.setItem("ca-exec-theme",document.body.classList.contains("day")?"day":"night")}catch(e){}}
try{if(localStorage.getItem("ca-exec-theme")==="day")document.body.classList.add("day")}catch(e){}

const MES_NOM={feb:"Febrero",mar:"Marzo",abr:"Abril",may:"Mayo",jun:"Junio",jul:"Julio",ago:"Agosto",sep:"Septiembre",acum:"Acumulado"};
const CF_ROLE={todos:"Consolidado",jv:"Julio Verne · Polanco",sonata:"Sonata · Puebla",bp:"Banca Partner"};
const fmt=n=>(n==null?"—":n.toLocaleString("es-MX"));
const money=n=>n==null?"—":"$"+Math.round(n).toLocaleString("es-MX");
function pctPill(v){const c=v>=60?"pill-hi":v>=30?"pill-mid":"pill-lo";return '<span class="pill '+c+'">'+v.toFixed(1)+'%</span>';}

function populateCF(){
  const s=$("cfSelect");s.innerHTML="";
  Object.keys(EXEC).forEach(k=>{
    const o=document.createElement("option");o.value=k;o.textContent=EXEC[k].nombre;s.appendChild(o);
  });
  s.value=Object.keys(EXEC)[0];
}
function populateMes(){
  const cf=$("cfSelect").value,s=$("mesSelect");s.innerHTML="";
  const order=(EXEC[cf]&&EXEC[cf].mesesOrder)||[];
  order.forEach(k=>{
    const o=document.createElement("option");o.value=k;
    o.textContent=(EXEC[cf].meses[k].label||MES_NOM[k]||k)+(EXEC[cf].meses[k].parcial?" (en curso)":"");
    s.appendChild(o);
  });
  s.value=order.includes("acum")?"acum":order[order.length-1];
}
function onCF(){populateMes();render();}

function sortedAsesores(node){
  return Object.keys(node.asesores).sort((a,b)=>node.asesores[b].n-node.asesores[a].n);
}

function render(){
  const cf=$("cfSelect").value,mk=$("mesSelect").value;
  const cfd=EXEC[cf];const node=cfd&&cfd.meses[mk];
  $("badgeParcial").style.display=(node&&node.parcial)?"inline-block":"none";
  const main=$("main");
  if(!node||!node.total||node.total.n===0){
    main.innerHTML='<div class="ph"><div><div class="ph-eyebrow">'+(cfd?cfd.nombre:"")+'</div>'
      +'<div class="ph-title-wrap"><div class="ph-gold-bar"></div><div class="ph-title">Desempeño <em>por Ejecutivo</em></div></div></div></div>'
      +'<div class="tbl-wrap"><div class="empty"><div class="empty-big">◦</div>Sin membresías cobradas en este periodo.</div></div>';
    $("foot").textContent="Fuente: BASE (cobrados) · Club Actinver";
    return;
  }
  const t=node.total, names=sortedAsesores(node);
  let h='';
  // header
  h+='<div class="ph"><div><div class="ph-eyebrow">'+cfd.nombre+' · '+(node.label||MES_NOM[mk])+'</div>'
   +'<div class="ph-title-wrap"><div class="ph-gold-bar"></div><div class="ph-title">Desempeño <em>por Ejecutivo</em></div></div></div>'
   +'<div class="ph-meta">'+names.length+' ejecutivos · '+fmt(t.n)+' membresías</div></div>';
  // summary strip
  h+='<div class="strip">'
   +stripCard("Contratadas",fmt(t.n),"Plus "+t.plus+" · Prime "+t.prime)
   +stripCard("Ingresos",money(t.ingresos),"membresía cobrada")
   +stripCard("Clientes Nuevos",fmt(t.clientesNuevos||0),"Plus "+(t.cnPlus||0)+" · Prime "+(t.cnPrime||0))
   +'</div>';
  // advisor cards
  h+='<div><div class="sec-title">Ranking de contratación</div><div class="ase-grid">';
  names.forEach((nm,i)=>{h+=aseCard(nm,node.asesores[nm],i+1,cf);});
  h+='</div></div>';
  // tables
  h+=tblContratacion(node,names);
  h+=tblActivacion(node,names);
  h+=tblUso(node,names);
  main.innerHTML=h;
  $("foot").textContent="Fuente: BASE (registros cobrados) · "+cfd.nombre+" · "+(node.label||MES_NOM[mk])+" · Club Actinver";
}

function stripCard(l,v,s){return '<div class="strip-card"><div class="strip-lbl">'+l+'</div><div class="strip-val">'+v+'</div><div class="strip-sub">'+s+'</div></div>';}

function aseCard(nm,d,rank,cf){
  const tot=d.plus+d.prime||1;
  const plusPct=d.plus/tot*100, primePct=d.prime/tot*100;
  return '<div class="ase-card"><div class="ase-rank">#'+rank+'</div>'
    +'<div class="ase-name">'+nm+'</div><div class="ase-role">'+(CF_ROLE[cf]||"")+'</div>'
    +'<div style="display:flex;align-items:flex-end;gap:10px"><div class="ase-big">'+d.n+'</div><div class="ase-big-lbl">contratadas</div></div>'
    +'<div class="pp-bar"><div class="pp-plus" style="width:'+plusPct+'%"></div><div class="pp-prime" style="width:'+primePct+'%"></div></div>'
    +'<div class="pp-legend"><span>Plus <b>'+d.plus+'</b></span><span>Prime <b>'+d.prime+'</b></span></div>'
    +'<div class="ase-mini">'
    +mini(d.act.tasaBO.toFixed(0)+"%","Activ. BO")
    +mini(d.uso.usaron1,"Usaron")
    +'</div></div>';
}
function mini(v,l){return '<div class="mini"><div class="mini-v">'+v+'</div><div class="mini-l">'+l+'</div></div>';}

function tblContratacion(node,names){
  let r='';
  names.forEach(nm=>{const d=node.asesores[nm];
    r+='<tr><td>'+nm+'</td><td>'+d.n+'</td><td>'+d.plus+'</td><td>'+d.prime+'</td><td>'+money(d.ingresos)+'</td></tr>';});
  const t=node.total;
  r+='<tr class="total-row"><td>TOTAL</td><td>'+t.n+'</td><td>'+t.plus+'</td><td>'+t.prime+'</td><td>'+money(t.ingresos)+'</td></tr>';
  return sec("Contratación de membresías",
    '<table><thead><tr><th>Ejecutivo</th><th>Contratadas</th><th>Plus</th><th>Prime</th><th>Ingresos</th></tr></thead><tbody>'+r+'</tbody></table>');
}
function tblActivacion(node,names){
  let r='';
  names.forEach(nm=>{const d=node.asesores[nm],a=d.act;
    r+='<tr><td>'+nm+'</td><td>'+a.bo+'</td><td>'+pctPill(a.tasaBO)+'</td><td>'+a.diagn+'</td><td>'+a.banca+'</td><td>'+a.tdd+'</td><td>'+a.divisa+'</td></tr>';});
  const a=node.total.act;
  r+='<tr class="total-row"><td>TOTAL</td><td>'+a.bo+'</td><td>'+a.tasaBO.toFixed(1)+'%</td><td>'+a.diagn+'</td><td>'+a.banca+'</td><td>'+a.tdd+'</td><td>'+a.divisa+'</td></tr>';
  return sec("Activación de beneficios",
    '<table><thead><tr><th>Ejecutivo</th><th>Activ. BO</th><th>Tasa BO</th><th>Diagnóstico</th><th>Banca Móvil</th><th>Tarjeta Dig.</th><th>Divisa Flex</th></tr></thead><tbody>'+r+'</tbody></table>');
}
function tblUso(node,names){
  let r='';
  const segs=d=>d.uso.segVida+d.uso.segAuto+d.uso.segHogar+d.uso.segViaje;
  names.forEach(nm=>{const d=node.asesores[nm],u=d.uso;
    r+='<tr><td>'+nm+'</td><td>'+u.usaron1+'</td><td>'+u.crossN+'</td><td>'+u.saldoCE+'</td><td>'+u.pagare+'</td><td>'+segs(d)+'</td><td>'+u.ppr+'</td><td>'+u.credito+'</td><td>'+u.transTDD+'</td></tr>';});
  const u=node.total.uso;const st=u.segVida+u.segAuto+u.segHogar+u.segViaje;
  r+='<tr class="total-row"><td>TOTAL</td><td>'+u.usaron1+'</td><td>'+u.crossN+'</td><td>'+u.saldoCE+'</td><td>'+u.pagare+'</td><td>'+st+'</td><td>'+u.ppr+'</td><td>'+u.credito+'</td><td>'+u.transTDD+'</td></tr>';
  return sec("Uso de beneficios / Cross-sell",
    '<table><thead><tr><th>Ejecutivo</th><th>Usaron ≥1</th><th>Cross</th><th>Saldo CE&gt;25k</th><th>Pagaré</th><th>Seguros</th><th>PPR&gt;5k</th><th>Crédito</th><th>Transac. TDD</th></tr></thead><tbody>'+r+'</tbody></table>');
}
function sec(title,inner){return '<div><div class="sec-title">'+title+'</div><div class="tbl-wrap">'+inner+'</div></div>';}

populateCF();populateMes();render();
</script>
</body>
</html>
